[package]
name = "thrum"
version = "0.5.3"
edition = "2024"
rust-version = "1.96"
description = "A terminal system monitor with dashboards for processes, network, disk, CPU, memory, and more"
license = "MIT"
authors = ["Divij Ganjoo"]
repository = "https://github.com/divijg19/Thrum"
keywords = ["system-monitor", "terminal", "tui", "dashboard"]
categories = ["command-line-utilities", "monitoring"]

[dependencies]
ratatui = { version = "0.30.1", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
sysinfo = "0.39"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
